<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パーツで覚える英単語">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{touch-action:pan-x pan-y}</style>
<script>
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
<title>パーツで覚える英単語</title>
<style>
/* Apple の Human Interface Guidelines に合わせた色。文字の色の差は 4.5:1 以上 */
:root{--bg:#f2f2f7;--group:#fff;--bar:#f9f9f9;--ink:#000;--sub:#636366;--tabgray:#6e6e73;--sep:rgba(60,60,67,.29);--fill:rgba(118,118,128,.12);--press:rgba(60,60,67,.12);--accent:#0058b8;--accent-fill:#0058b8;--ok:#1e7a35;--ng:#c4001a;--pre:#8a35c0;--root:#ad4a00;--suf:#00727f;--pre-bg:rgba(175,82,222,.13);--root-bg:rgba(255,149,0,.15);--suf-bg:rgba(48,176,199,.15);--scrim:rgba(0,0,0,.4);--toast:rgba(30,30,32,.94)}
@media (prefers-color-scheme:dark){
:root{--bg:#000;--group:#1c1c1e;--bar:#161617;--ink:#fff;--sub:#98989f;--tabgray:#8e8e93;--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--press:rgba(255,255,255,.12);--accent:#5aabff;--accent-fill:#0a5fd6;--ok:#30d158;--ng:#ff6961;--pre:#d993ff;--root:#ff9f0a;--suf:#40c8e0;--pre-bg:rgba(191,90,242,.2);--root-bg:rgba(255,159,10,.18);--suf-bg:rgba(64,200,224,.18);--scrim:rgba(0,0,0,.6);--toast:rgba(58,58,60,.96)}
.sheet,.acts{--group:#2c2c2e;--bg:#1c1c1e}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;font:-apple-system-body}
html,body{height:100%;overflow:hidden;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:1rem;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;padding:0;text-align:inherit}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 16px 6px;background:var(--bg)}
.top h1{font-size:min(2rem,40px);line-height:1.2;margin:0;font-weight:700;letter-spacing:.01em}
.tsub{font-size:min(.765rem,18px);color:var(--sub);white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 28px}
.tabs{display:flex;background:var(--bar);box-shadow:0 -.5px 0 var(--sep);position:relative;z-index:2}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:5px 0 3px;font-size:11px;font-weight:500;color:var(--tabgray);text-align:center}
.tabs svg{width:27px;height:27px;fill:currentColor}
.tabs button.on{color:var(--accent)}
.ic{width:22px;height:22px;fill:currentColor}
.sub{color:var(--sub)}.small{font-size:.765rem}
.mt{margin-top:12px}
.grow{flex:1;min-width:0}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
/* パーツの色（操作の青・正解の緑・不正解の赤とは別の色にする） */
.seg.p{color:var(--pre)}.seg.r{color:var(--root)}.seg.s{color:var(--suf)}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;font-weight:600;white-space:nowrap}
.chip.p{background:var(--pre-bg);color:var(--pre)}.chip.r{background:var(--root-bg);color:var(--root)}.chip.s{background:var(--suf-bg);color:var(--suf)}
.wb{display:inline-flex;flex-wrap:wrap;justify-content:center;max-width:100%}
.seg{overflow-wrap:anywhere;min-width:0}
.word-big.xlong{font-size:min(1.3rem,32px)}
.qchip{font-size:min(1.76rem,30px);padding:4px 14px;white-space:normal;max-width:100%}
.qchip.long{font-size:min(1.3rem,22px)}
.word-big{text-align:center;font-weight:700;font-size:min(2.35rem,52px);line-height:1.25;margin:20px 0 8px;letter-spacing:.005em}
.word-big.long{font-size:min(1.76rem,42px)}
.word-big .seg{border-bottom:3px solid currentColor;margin:0 3px;padding:0 1px}
.mini{font-weight:600;font-size:1rem}
.mini .seg.focus{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pos{text-align:center;color:var(--sub);font-size:.882rem;display:flex;justify-content:center;align-items:center;gap:6px}
.say{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.say:active{background:var(--press)}
.legend{display:flex;gap:14px;justify-content:center;font-size:.765rem;color:var(--sub);margin:10px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* カード */
.progress{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--accent);border-radius:2px;transition:width .3s cubic-bezier(.2,.8,.2,1)}
.cardbox{background:var(--group);border-radius:22px;padding:16px 18px 22px;min-height:320px;margin-top:4px;cursor:pointer}
.cmeta{display:flex;justify-content:space-between;align-items:center;font-size:.765rem;color:var(--sub)}
.tag{font-size:.765rem;padding:2px 9px;border-radius:999px;background:var(--fill);color:var(--sub);font-weight:600}
.tag.new{color:var(--accent)}.tag.ng{color:var(--ng)}.tag.ok{color:var(--ok)}
.hint{text-align:center;color:var(--sub);font-size:.882rem;margin-top:44px}
.reveal{animation:reveal .25s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mean{text-align:center;font-size:1.176rem;font-weight:700;margin:16px 0 12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;box-shadow:inset 0 .5px 0 var(--sep);position:relative}
.plist li .chip{min-width:64px;text-align:center}
.plist b{display:block;font-weight:600}.plist small{display:block;color:var(--sub);font-size:.765rem}
.origin{background:var(--fill);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:.882rem}
.ex{margin-top:12px;padding-left:12px;border-left:3px solid var(--fill)}
.ex p{margin:0 0 4px}.ex p+p{color:var(--sub);font-size:.882rem}
mark{background:transparent;color:var(--accent);font-weight:700}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:sticky;bottom:-28px;padding:12px 0 28px;background:var(--bg)}
/* ボタン：塗りは1画面に1〜2個。ほかは灰色の地か文字だけ */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;padding:12px 16px;border-radius:999px;font-weight:600;font-size:1rem;background:var(--fill);color:var(--accent);text-align:center;transition:opacity .15s}
.btn:active{opacity:.6}
.btn.primary{background:var(--accent-fill);color:#fff}
.answer .btn+.btn,.row2 .btn+.btn{margin-top:0}
.btn.plain{background:none}
.btn.danger{color:var(--ng)}
.btn.small{display:inline-flex;width:auto;min-height:44px;padding:8px 16px;white-space:nowrap;flex:none}
.btn+.btn{margin-top:10px}
.done{background:var(--group);border-radius:22px;padding:24px 18px 18px;text-align:center;margin-top:8px}
.done h2{margin:0 0 6px;font-size:1.294rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--fill);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:1.294rem;font-weight:700}.stats span{font-size:.765rem;color:var(--sub)}
.banner{display:flex;align-items:center;gap:10px;background:var(--group);border-radius:12px;padding:4px 4px 4px 14px;font-size:.882rem;margin:4px 0 10px}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap;min-height:44px;padding:0 12px}
/* 分割ボタン */
.segc{display:flex;background:var(--fill);border-radius:999px;padding:2px;margin-top:4px}
.segc button{flex:1;min-height:44px;border-radius:999px;font-size:.882rem;font-weight:500;text-align:center;transition:background .2s}
.segc button.on{background:var(--group);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.segc button.on{background:#636366}}
/* 一覧（iOS の設定画面と同じ角丸のまとまり） */
.group{background:var(--group);border-radius:12px;margin:0;padding:0;list-style:none;overflow:hidden}
.ghead{font-size:.765rem;color:var(--sub);margin:22px 16px 6px}
.gfoot{font-size:.765rem;color:var(--sub);margin:6px 16px 0}
.cell{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 16px;position:relative;width:100%;font-size:1rem}
.cell+.cell::before,.wl li+li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.cell:active,li[data-act]:active{background:var(--press)}
.cell.link{color:var(--accent)}.cell.red{color:var(--ng)}
.chev{width:9px;height:14px;flex:none;color:var(--tabgray);opacity:.7}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 16px;position:relative;cursor:pointer}
.wl .wm{flex:1;text-align:right;color:var(--sub);font-size:.882rem;min-width:0}
.st{flex:none;width:2.6em;text-align:right;font-size:.765rem;font-weight:600}
.st.ok{color:var(--ok)}.st.ng{color:var(--ng)}
.psec{scroll-margin-top:8px}
.phead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start;margin:22px 4px 8px}
.phead .chip{white-space:normal;max-width:100%}
.phead .grow{flex:1 1 150px}
.phead b{display:block;font-weight:600}
.phead small{display:block;color:var(--sub);font-size:.765rem}
.cnt{font-size:.765rem;color:var(--sub);white-space:nowrap}
.psec.flash .group{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.searchrow{display:flex;gap:8px;align-items:center;margin-top:4px}
.filters{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{min-height:44px;display:flex;align-items:center;flex:none}
.filters span{padding:6px 14px;border-radius:999px;background:var(--fill);font-size:.882rem;white-space:nowrap}
.filters button.on span{background:var(--ink);color:var(--bg);font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:17px;min-height:44px;padding:10px 14px;border-radius:10px;border:0;background:var(--group);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=search]{background:var(--fill);padding-left:14px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.765rem;color:var(--sub);margin:0 0 6px 14px}
.segrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.segrow .chip{margin-top:10px;min-width:56px;text-align:center}
.segrow .row2{margin-top:6px}
.steps{padding:4px 16px 4px 40px;margin:12px 0 0;list-style:decimal}
.steps li{padding:10px 0;font-size:.941rem;line-height:1.5}
.steps li+li{box-shadow:inset 0 .5px 0 var(--sep)}
.err{color:var(--ng);font-weight:600;font-size:.882rem;margin:12px 4px 0}
/* スイッチ */
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;min-height:0;padding:0;border-radius:999px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus{outline:none}
/* クイズ */
.qhead{display:flex;justify-content:space-between;font-size:.765rem;color:var(--sub);margin-top:4px}
.qcard{background:var(--group);border-radius:22px;padding:14px 16px 20px;margin-top:8px}
.hints{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.hints div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.765rem;color:var(--sub)}
.qex{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:10px}
.choices{margin-top:12px}
.choice{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 16px;position:relative;font-size:1rem}
.choice:active:not([disabled]){background:var(--press)}
.choice .mk{margin-left:auto;font-weight:700;flex:none}
.choice.right{color:var(--ok);font-weight:600}
.choice.wrong{color:var(--ng)}
.choice[disabled]{cursor:default}
.score{font-size:min(2.6rem,56px);font-weight:700;text-align:center;margin:6px 0 0}
/* 設定 */
.opts{display:flex;gap:2px;background:var(--fill);border-radius:999px;padding:2px;flex:1}
.opts button{flex:1;min-height:44px;border-radius:999px;font-size:.882rem;text-align:center}
.opts button.on{background:var(--group);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.opts button.on{background:#636366}}
/* シート */
#sheetWrap,#actWrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
#actWrap{z-index:70}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s}
.sheet{position:relative;background:var(--bg);border-radius:14px 14px 0 0;max-height:94%;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(28px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.32,.72,0,1)}
.sh-head{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;margin:0 -16px;padding:4px 8px 0;background:var(--bg)}
.sh-head h2{margin:0;font-size:1rem;font-weight:600;text-align:center}
.sh-head .l{justify-self:start}.sh-head .r{justify-self:end;font-weight:600}
.x{color:var(--accent);min-height:44px;padding:0 8px;font-size:1rem}
.x:active{opacity:.5}
.acts{position:relative;padding:0 8px calc(8px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.32,.72,0,1)}
.acts .group{border-radius:14px;text-align:center;background:var(--group)}
.acts .atitle{padding:14px 16px;font-size:.765rem;color:var(--sub)}
.acts .cell{justify-content:center;min-height:56px;font-size:1.06rem}
.acts .atitle+.cell::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.acts .cancel{margin-top:8px;font-weight:600;color:var(--accent);border-radius:14px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--toast);color:#fff;border-radius:14px;padding:4px 6px 4px 16px;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:60;font-size:.882rem;animation:reveal .25s;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#toast button{color:#64a8ff;font-weight:600;min-height:44px;padding:0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (hover:hover){.wl li:hover,button.cell:hover{background:var(--press)}}
</style>
<style>
html{position:fixed;top:0;right:0;bottom:0;left:0;height:auto;padding:0;overflow:hidden}
body{position:absolute;top:0;right:0;bottom:0;left:0;height:auto;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (display-mode: standalone) {
  html{position:static;height:100lvh;overflow:visible}
  body{position:static;height:100lvh;overflow:visible}
  #sheetWrap,#actWrap{bottom:auto;height:100lvh}
  .top{padding-top:34px}
}
</style>

</head>
<body>


<header class="top"><h1 id="ttl">カード</h1><span class="tsub" id="tsub"></span></header>
<main id="main">
  <section id="v-card"></section>
  <section id="v-roots" hidden></section>
  <section id="v-quiz" hidden></section>
  <section id="v-list" hidden></section>
  <section id="v-set" hidden></section>
</main>
<nav class="tabs">
  <button data-act="tab" data-t="card"><svg viewBox="0 0 24 24"><path d="M8 2h10a3 3 0 0 1 3 3v12.5h-1.8V5A1.2 1.2 0 0 0 18 3.8H8z"/><rect x="3" y="6" width="14.5" height="16" rx="3"/></svg>カード</button>
  <button data-act="tab" data-t="roots"><svg viewBox="0 0 24 24"><rect x="1.5" y="6" width="5.5" height="12" rx="1.8"/><rect x="8.5" y="6" width="8" height="12" rx="1.8"/><rect x="18" y="6" width="4.5" height="12" rx="1.8"/></svg>パーツ</button>
  <button data-act="tab" data-t="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/><path d="M9.3 9.4a2.8 2.8 0 1 1 4 2.5c-.8.4-1.3 1-1.3 1.8v.4" fill="none" stroke="var(--bar)" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.4" fill="var(--bar)"/></svg>クイズ</button>
  <button data-act="tab" data-t="list"><svg viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="2"/><circle cx="4.5" cy="12" r="2"/><circle cx="4.5" cy="18" r="2"/><rect x="9" y="4.8" width="13" height="2.4" rx="1.2"/><rect x="9" y="10.8" width="13" height="2.4" rx="1.2"/><rect x="9" y="16.8" width="13" height="2.4" rx="1.2"/></svg>単語</button>
  <button data-act="tab" data-t="set"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.3 1.5h3.4l.5 2.6c.7.2 1.3.5 1.9.9l2.3-1.4 2.4 2.4-1.4 2.3c.4.6.7 1.2.9 1.9l2.6.5v3.4l-2.6.5c-.2.7-.5 1.3-.9 1.9l1.4 2.3-2.4 2.4-2.3-1.4c-.6.4-1.2.7-1.9.9l-.5 2.6h-3.4l-.5-2.6c-.7-.2-1.3-.5-1.9-.9l-2.3 1.4-2.4-2.4 1.4-2.3c-.4-.6-.7-1.2-.9-1.9l-2.6-.5v-3.4l2.6-.5c.2-.7.5-1.3.9-1.9L3.2 6l2.4-2.4 2.3 1.4c.6-.4 1.2-.7 1.9-.9zM12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4z"/></svg>設定</button>
</nav>
<div id="sheetWrap" hidden><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div id="actWrap" hidden><div class="scrim" data-act="actCancel"></div><div class="acts" id="acts"></div></div>
<div id="toast" hidden></div>

<script>
/*DATA*/
// パーツ：id: [種類(p接頭辞/r語根/s接尾辞), 形(カンマ区切り), 意味, ひとこと語源]
const PB={
in_in:["p","in,im","中へ・上に","ラテン語 in「中に・上に」"],
in_not:["p","in,im,il,ir","〜でない","ラテン語 in-「否定」"],
un:["p","un","〜でない","古英語 un-「否定」"],

const KEY='partsWordbook.v1';
const DAY=864e5;
const INT=[0,1,3,7,14,30,60];
const TYPE_NAME={p:'接頭辞',r:'語根',s:'接尾辞'};
const ST_NAME={new:'未学習',ng:'まだ',ok:'覚えた'};
const POS=['動','名','形','副','動・名','名・動','形・名','動・形','前・動','その他'];
const TITLES={card:'カード',roots:'パーツ',quiz:'クイズ',list:'単語',set:'設定'};
const ICON={
  say:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 9.6v4.8c0 .6.5 1.1 1.1 1.1h2.8l4.4 3.7c.7.6 1.7.1 1.7-.8V5.6c0-.9-1-1.4-1.7-.8L6.9 8.5H4.1C3.5 8.5 3 9 3 9.6z"/><path d="M16.2 8.6a5 5 0 0 1 0 6.8M18.8 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 9 14"><path d="M1.5 1.5 7 7l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const str=v=>typeof v==='string'?v:'';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startOfDay(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ---------- 保存と読み込み ---------- */
let S,P={},W=[],WMAP={};
function defState(){return {v:1,tab:'card',rootTab:'r',prog:{},words:[],parts:{},set:{newPerDay:10,qLearned:false,badge:false},day:{date:'',newDone:0},sess:null,quiz:null,draft:null,newDraft:null,lastBackup:0,firstUse:Date.now()}}
function blankDraft(){return {id:null,w:'',pos:'動',m:'',split:'',touched:false,sel:{},g:'',ex:'',exj:''}}
function validPart(v){return v&&typeof v==='object'&&['p','r','s'].includes(v.type)&&Array.isArray(v.forms)&&v.forms.length&&v.forms.every(f=>typeof f==='string'&&f)&&typeof v.m==='string'}
function validWord(w){return w&&typeof w==='object'&&typeof w.id==='string'&&w.id.startsWith('c_')&&typeof w.w==='string'&&w.w&&typeof w.m==='string'&&Array.isArray(w.segs)&&w.segs.length>0&&w.segs.every(s=>s&&typeof s.id==='string'&&typeof s.t==='string'&&s.t)}
function validQuiz(q){return q&&typeof q==='object'&&(q.mode==='w'||q.mode==='p')&&Number.isInteger(q.i)&&q.i>=0&&Array.isArray(q.qs)&&q.qs.length>0&&q.qs.every(it=>it&&typeof it.k==='string'&&Array.isArray(it.ch)&&it.ch.length>=2&&it.ch.every(c=>typeof c==='string')&&Number.isInteger(it.a)&&it.a>=0&&it.a<it.ch.length&&(it.pick===null||(Number.isInteger(it.pick)&&it.pick>=0&&it.pick<it.ch.length)))}
function sanDraft(x){
  if(!x||typeof x!=='object'||typeof x.w!=='string')return null;
  const d=blankDraft();
  for(const k of ['w','pos','m','split','g','ex','exj'])d[k]=str(x[k])||d[k];
  d.id=typeof x.id==='string'?x.id:null;
  d.touched=x.touched===true;
  if(x.sel&&typeof x.sel==='object')for(const [k,v] of Object.entries(x.sel)){if(v&&typeof v==='object')d.sel[k]={pid:str(v.pid),nm:str(v.nm),nt:['p','r','s'].includes(v.nt)?v.nt:'r'}}
  return d;
}
function sanitize(o){
  if(!o||typeof o!=='object')return null;
  const s=defState();
  if(Object.prototype.hasOwnProperty.call(TITLES,o.tab))s.tab=o.tab;
  if(['p','r','s'].includes(o.rootTab))s.rootTab=o.rootTab;
  if(o.prog&&typeof o.prog==='object')for(const [k,v] of Object.entries(o.prog)){
    if(v&&typeof v==='object'&&Number.isFinite(v.b)&&Number.isFinite(v.d))s.prog[k]={b:Math.min(6,Math.max(0,v.b|0)),d:v.d,n:Math.max(0,v.n|0),w:Math.max(0,v.w|0)};
  }
  if(o.parts&&typeof o.parts==='object')for(const [k,v] of Object.entries(o.parts)){
    if(k.startsWith('u_')&&validPart(v))s.parts[k]={type:v.type,forms:v.forms.map(f=>f.toLowerCase()),m:v.m,o:str(v.o)};
  }
  if(Array.isArray(o.words))for(const w of o.words){
    if(validWord(w)&&!s.words.some(x=>x.id===w.id))s.words.push({id:w.id,w:w.w,pos:str(w.pos)||'その他',m:w.m,segs:w.segs.map(x=>({id:x.id,t:x.t})),g:str(w.g),ex:str(w.ex),exj:str(w.exj)});
  }
  if(o.set&&typeof o.set==='object'){
    if([5,10,15,20].includes(o.set.newPerDay))s.set.newPerDay=o.set.newPerDay;
    s.set.qLearned=o.set.qLearned===true;
    s.set.badge=o.set.badge===true;
  }
  if(o.day&&typeof o.day.date==='string')s.day={date:o.day.date,newDone:Math.max(0,o.day.newDone|0)};
  if(o.sess&&typeof o.sess==='object'&&typeof o.sess.date==='string'&&Array.isArray(o.sess.q)){
    s.sess={date:o.sess.date,q:o.sess.q.filter(x=>typeof x==='string'),i:Math.max(0,o.sess.i|0),again:Array.isArray(o.sess.again)?o.sess.again.filter(x=>typeof x==='string'):[],ok:Math.max(0,o.sess.ok|0),ng:Math.max(0,o.sess.ng|0)};
  }
  if(validQuiz(o.quiz))s.quiz={mode:o.quiz.mode,i:o.quiz.i,qs:o.quiz.qs.map(it=>({k:it.k,ch:it.ch.slice(),a:it.a,pick:it.pick}))};
  s.draft=sanDraft(o.draft);
  s.newDraft=sanDraft(o.newDraft);
  if(s.newDraft&&s.newDraft.id)s.newDraft=null;
  if(Number.isFinite(o.lastBackup))s.lastBackup=o.lastBackup;
  if(Number.isFinite(o.firstUse))s.firstUse=o.firstUse;
  return s;
}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=sanitize(raw)||defState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存できませんでした（空き容量を確かめてください）');return false}}
function rebuild(){
  P={};
  for(const [id,a] of Object.entries(PB))P[id]={id,type:a[0],forms:a[1].split(','),m:a[2],o:a[3],base:true};
  for(const [id,p] of Object.entries(S.parts))P[id]={id,...p,base:false};
  W=WB.map(a=>({id:a[0],w:a[0],pos:a[1],m:a[2],segs:a[3].split('|').map(x=>{const i=x.indexOf(':');return i<0?{id:x,t:x}:{id:x.slice(0,i),t:x.slice(i+1)}}),g:a[4],ex:a[5],exj:a[6],base:true}));
  for(const w of S.words)W.push({...w,base:false});
  WMAP={};for(const w of W)WMAP[w.id]=w;
}
function statusOf(id){const p=S.prog[id];return !p?'new':p.b===0?'ng':'ok'}
function counts(){let ok=0,ng=0,nw=0;for(const w of W){const s=statusOf(w.id);if(s==='ok')ok++;else if(s==='ng')ng++;else nw++}return {ok,ng,nw}}
function partUsage(){const u={};for(const w of W)for(const s of w.segs){(u[s.id]||(u[s.id]=[]));if(!u[s.id].includes(w.id))u[s.id].push(w.id)}return u}

/* ---------- 表示の部品 ---------- */
function partsWord(w,focus){return `<span class="wb">${w.segs.map(s=>{const t=P[s.id]?P[s.id].type:'r';return `<span class="seg ${t}${focus&&s.id===focus?' focus':''}">${esc(s.t)}</span>`}).join('')}</span>`}
function bigWord(w){return `<div class="word-big${w.w.length>16?' xlong':w.w.length>10?' long':''}">${partsWord(w)}</div>`}
function hl(ex,w){
  const e=esc(ex);
  for(const c of [w,w.length>4?w.slice(0,-1):null]){
    if(!c)continue;
    const re=new RegExp('\\b('+escRe(c)+'\\w*)','i');
    if(re.test(e))return e.replace(re,'<mark>$1</mark>');
  }
  return e;
}
function detailBody(w,link){
  return `<div class="mean">${esc(w.m)}</div>
  <ul class="plist">${w.segs.map(sg=>{const p=P[sg.id];const ty=p?p.type:'r';
    return `<li><span class="chip ${ty}"${link&&p?` data-act="part" data-id="${esc(p.id)}"`:''}>${esc(sg.t)}</span><div><b>${p?esc(p.m):'？'}</b><small>${TYPE_NAME[ty]}${p&&p.o?'・'+esc(p.o):''}</small></div></li>`}).join('')}</ul>
  ${w.g?`<p class="origin">${esc(w.g)}</p>`:''}
  ${w.ex?`<div class="ex"><p lang="en">${hl(w.ex,w.w)}</p>${w.exj?`<p>${esc(w.exj)}</p>`:''}</div>`:''}`;
}
function sayBtn(w){return `<button class="say" data-act="say" data-w="${esc(w.w)}" aria-label="発音を聞く">${ICON.say}</button>`}
const LEGEND='<div class="legend"><span><i style="background:var(--pre)"></i>接頭辞</span><span><i style="background:var(--root)"></i>語根</span><span><i style="background:var(--suf)"></i>接尾辞</span></div>';
function statsHtml(){const c=counts();return `<div class="stats"><div><b>${c.ok}</b><span>覚えた</span></div><div><b>${c.ng}</b><span>まだ</span></div><div><b>${c.nw}</b><span>未学習</span></div></div>`}
function needBackup(){const has=Object.keys(S.prog).length||S.words.length;return has&&Date.now()-(S.lastBackup||S.firstUse)>30*DAY}
function backupBanner(){return needBackup()?`<div class="banner"><span class="grow">${S.lastBackup?'最後のバックアップから30日たちました。':'まだバックアップを保存していません。'}</span><button data-act="backup">保存する</button></div>`:''}

/* ---------- 画面の切り替え ---------- */
function render(){
  for(const t of Object.keys(TITLES))$('#v-'+t).hidden=t!==S.tab;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $('#ttl').textContent=TITLES[S.tab];
  const c=counts();$('#tsub').textContent=`覚えた ${c.ok} / ${W.length}語`;
  ({card:renderCard,roots:renderRoots,quiz:renderQuiz,list:renderList,set:renderSet})[S.tab]();
  updateBadge();

function toTop(){$('#main').scrollTop=0}

/* ---------- カード ---------- */
let flipped=false;
function buildSession(onlyNew){
  if(S.day.date!==today())S.day={date:today(),newDone:0};
  const now=Date.now();
  const due=onlyNew?[]:W.filter(w=>{const p=S.prog[w.id];return p&&p.d<=now}).sort((a,b)=>S.prog[a.id].d-S.prog[b.id].d).map(w=>w.id);
  const room=onlyNew?S.set.newPerDay:Math.max(0,S.set.newPerDay-S.day.newDone);
  const unseen=W.filter(w=>!S.prog[w.id]);
  const fresh=unseen.filter(w=>!w.base).concat(unseen.filter(w=>w.base)).slice(0,room).map(w=>w.id);
  S.sess={date:today(),q:due.concat(fresh),i:0,again:[],ok:0,ng:0};
  flipped=false;save();
}
function renderCard(){
  const v=$('#v-card');
  if(!S.sess||S.sess.date!==today())buildSession(false);
  const s=S.sess;
  while(s.i<s.q.length&&!WMAP[s.q[s.i]])s.i++;
  let h=backupBanner();
  if(s.i>=s.q.length){
    const c=counts();
    h+=`<div class="done"><h2>${s.q.length?'今日の分は終わりです':'今日やる単語はありません'}</h2>
      <p class="sub">${s.q.length?`覚えた ${s.ok}回 ／ まだ ${s.ng}回`:'新しい単語を足すか、明日また開いてください。'}</p>${statsHtml()}
      ${c.nw?`<button class="btn primary" data-act="more">新しい単語をあと${Math.min(S.set.newPerDay,c.nw)}語</button>`:''}
      ${c.ng?`<button class="btn" data-act="retry">「まだ」の単語をもう一度（${c.ng}語）</button>`:''}
      ${!c.nw&&!c.ng?'<p>入っている単語はすべて学習しました。</p>':''}</div>`;
    v.innerHTML=h;return;
  }
  const w=WMAP[s.q[s.i]],st=statusOf(w.id);
  const tag=st==='new'?'<span class="tag new">新しい単語</span>':st==='ng'?'<span class="tag ng">まだ</span>':'<span class="tag">復習</span>';
  /* 塗りのボタンは「覚えた」だけ。「まだ」は灰色の地にする */
  h+=`<div class="progress"><div style="width:${s.i/s.q.length*100}%"></div></div>${LEGEND}
  <div class="cardbox" data-act="flip">
    <div class="cmeta">${tag}<span>${s.i+1} / ${s.q.length}</span></div>
    ${bigWord(w)}
    <div class="pos">${esc(w.pos)} ${sayBtn(w)}</div>
    ${flipped?`<div class="reveal">${detailBody(w,false)}</div>`:'<p class="hint">パーツの意味を思い出してから、タップして答えを見る</p>'}
  </div>
  ${flipped?'<div class="answer"><button class="btn" data-act="judge" data-v="0">まだ</button><button class="btn primary" data-act="judge" data-v="1">覚えた</button></div>':''}`;
  v.innerHTML=h;
}
function judge(ok){
  const s=S.sess,id=s.q[s.i];if(!id)return;
  const old=S.prog[id];
  if(!old)S.day.newDone++;
  const p=old?{...old}:{b:0,d:0,n:0,w:0};
  p.n++;
  if(ok){p.b=Math.min(p.b+1,6);p.d=startOfDay()+INT[p.b]*DAY;s.ok++}
  else{p.b=0;p.d=Date.now();p.w++;s.ng++;if(s.again.filter(x=>x===id).length<2){s.q.push(id);s.again.push(id)}}
  S.prog[id]=p;s.i++;flipped=false;save();render();toTop();
}
function setStatus(id,ok){
  const p=S.prog[id]?{...S.prog[id]}:{b:0,d:0,n:0,w:0};
  if(ok){p.b=Math.max(1,p.b);p.d=startOfDay()+INT[p.b]*DAY}else{p.b=0;p.d=Date.now();p.w++}
  S.prog[id]=p;
}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- クイズ ---------- */
function quizExists(k,mode){return mode==='w'?!!WMAP[k]:!!P[k]}
function makeQuiz(mode){
  let qs=[];
  if(mode==='w'){
    let pool=W.slice();
    if(S.set.qLearned){const lp=W.filter(w=>S.prog[w.id]);if(lp.length>=10)pool=lp}
    const weak=shuffle(pool.filter(w=>S.prog[w.id]&&S.prog[w.id].b===0));
    const rest=shuffle(pool.filter(w=>!(S.prog[w.id]&&S.prog[w.id].b===0)));
    const picks=shuffle(weak.concat(rest).slice(0,10));
    qs=picks.map(w=>{
      const roots=new Set(w.segs.filter(s=>P[s.id]&&P[s.id].type==='r').map(s=>s.id));
      const used=new Set([w.m]),wrong=[];
      const take=list=>{for(const x of list){if(wrong.length>=3)break;if(x.id===w.id||used.has(x.m))continue;used.add(x.m);wrong.push(x.id)}};
      take(shuffle(W.filter(x=>x.segs.some(s=>roots.has(s.id)))).slice(0,4));
      if(wrong.length>2)wrong.length=2;
      take(shuffle(W));
      const ch=shuffle([w.id,...wrong]);
      return {k:w.id,ch,a:ch.indexOf(w.id),pick:null};
    });
  }else{
    const u=partUsage();
    let pool=Object.keys(u).filter(id=>P[id]);
    if(S.set.qLearned){const lp=pool.filter(id=>u[id].some(w=>S.prog[w]));if(lp.length>=10)pool=lp}
    qs=shuffle(pool).slice(0,10).map(id=>{
      const t=P[id].type,used=new Set([P[id].m]),wrong=[];
      for(const x of shuffle(Object.keys(u).filter(x=>P[x]&&P[x].type===t))){if(wrong.length>=3)break;if(x===id||used.has(P[x].m))continue;used.add(P[x].m);wrong.push(x)}
      const ch=shuffle([id,...wrong]);
      return {k:id,ch,a:ch.indexOf(id),pick:null};
    });
  }
  S.quiz={mode,qs,i:0};save();
}
function renderQuiz(){
  const v=$('#v-quiz');let q=S.quiz;
  if(q&&q.qs.some(it=>!quizExists(it.k,q.mode)||it.ch.some(c=>!quizExists(c,q.mode)))){S.quiz=q=null;save()}
  if(!q){
    const learned=W.filter(w=>S.prog[w.id]).length;
    v.innerHTML=`<p class="ghead" style="margin-top:8px">10問ずつ、4つから選びます</p>
    <div class="group">
      <button class="cell" data-act="qstart" data-m="w"><span class="grow"><b style="font-weight:600">単語の意味を当てる</b><br><span class="sub small">パーツの意味をヒントに選ぶ</span></span>${ICON.chev}</button>
      <button class="cell" data-act="qstart" data-m="p"><span class="grow"><b style="font-weight:600">パーツの意味を当てる</b><br><span class="sub small">接頭辞・語根・接尾辞の意味を選ぶ</span></span>${ICON.chev}</button>
    </div>
    <p class="ghead">出す範囲</p>
    <div class="group"><label class="cell"><span class="grow">学習した単語から出す</span><input type="checkbox" class="switch" id="qLearned" ${S.set.qLearned?'checked':''}></label></div>
    <p class="gfoot">${S.set.qLearned&&learned<10?`学習した単語がまだ${learned}語なので、今は全体から出します。`:''}間違えた単語は「まだ」になり、カードの復習に出てきます。</p>`;
    v.onchange=e=>{if(e.target.id==='qLearned'){S.set.qLearned=e.target.checked;save();renderQuiz()}};
    return;
  }
  v.onchange=null;
  if(q.i>=q.qs.length){
    const right=q.qs.filter(it=>it.pick===it.a).length;
    const wrongs=q.qs.filter(it=>it.pick!==it.a);
    v.innerHTML=`<div class="done"><p class="sub">${q.mode==='w'?'単語の意味':'パーツの意味'}</p><p class="score">${right} / ${q.qs.length}</p>
    <p>${right===q.qs.length?'全問正解です。':right>=7?'あと少しで全問正解です。':'間違えたものを見直しておきましょう。'}</p>
    </div>
    ${wrongs.length?`<p class="ghead">間違えたもの</p><ul class="group wl">${wrongs.map(it=>q.mode==='w'?wordRow(WMAP[it.k]):`<li data-act="part" data-id="${esc(it.k)}"><span class="chip ${P[it.k].type}">${esc(P[it.k].forms[0])}</span><span class="wm">${esc(P[it.k].m)}</span></li>`).join('')}</ul>`:''}
    <button class="btn primary mt" data-act="qstart" data-m="${q.mode}">もう一度（10問）</button><button class="btn plain" data-act="qend">クイズを終わる</button>`;
    return;
  }
  const it=q.qs[q.i],answered=it.pick!==null;
  let body='';
  if(q.mode==='w'){
    const w=WMAP[it.k];
    body=`${bigWord(w)}<div class="pos">${esc(w.pos)} ${sayBtn(w)}</div>
    <div class="hints">${w.segs.map(s=>{const p=P[s.id];return `<div><span class="chip ${p?p.type:'r'}">${esc(s.t)}</span><span>${p?esc(p.m):'？'}</span></div>`}).join('')}</div>`;
  }else{
    const p=P[it.k],u=partUsage()[it.k]||[];
    const ftxt=p.forms.slice(0,3).join(' / ');
    body=`<div class="word-big"><span class="chip qchip ${p.type}${ftxt.length>14?' long':''}">${esc(ftxt)}</span></div>
    <div class="pos">${TYPE_NAME[p.type]}</div>
    <div class="qex">${u.slice(0,4).map(id=>`<span class="mini">${partsWord(WMAP[id],it.k)}</span>`).join('')}</div>`;
  }
  const label=c=>q.mode==='w'?WMAP[c].m:P[c].m;
  const choices=it.ch.map((c,i)=>{
    let cls='choice cell',mk='';
    if(answered){if(i===it.a){cls+=' right';mk='<span class="mk">✓ 正解</span>'}else if(i===it.pick){cls+=' wrong';mk='<span class="mk">✕</span>'}}
    return `<button class="${cls}" data-act="qpick" data-i="${i}" ${answered?'disabled':''}><span class="grow">${esc(label(c))}</span>${mk}</button>`;
  }).join('');
  let after='';
  if(answered){
    if(q.mode==='w'){const w=WMAP[it.k];after=`<div class="reveal">${w.g?`<p class="origin">${esc(w.g)}</p>`:''}${w.ex?`<div class="ex"><p lang="en">${hl(w.ex,w.w)}</p>${w.exj?`<p>${esc(w.exj)}</p>`:''}</div>`:''}</div>`}
    else{const p=P[it.k],u=partUsage()[it.k]||[];after=`<div class="reveal">${p.o?`<p class="origin">${esc(p.o)}</p>`:''}<ul class="group wl mt">${u.slice(0,4).map(id=>wordRow(WMAP[id],it.k)).join('')}</ul></div>`}
  }
  v.innerHTML=`<div class="qhead"><span>${q.mode==='w'?'単語の意味':'パーツの意味'}</span><span>${q.i+1} / ${q.qs.length}</span></div>
  <div class="progress"><div style="width:${q.i/q.qs.length*100}%"></div></div>
  <div class="qcard">${body}</div><div class="group choices">${choices}</div>${after}
  ${answered?`<div class="answer" style="grid-template-columns:1fr"><button class="btn primary" data-act="qnext">${q.i+1<q.qs.length?'次へ':'結果を見る'}</button></div>`:''}`;
}

/* ---------- 単語の追加 ---------- */
function segsOf(split){return split.split('/').map(s=>s.trim()).filter(Boolean)}
function candidates(t){
  const l=t.toLowerCase();
  return Object.values(P).filter(p=>p.forms.includes(l));
}
function suggest(word){
  const s=word.toLowerCase().replace(/[^a-z]/g,'');const n=s.length;if(!n)return '';
  const forms=[];for(const p of Object.values(P))for(const f of p.forms)forms.push({f,t:p.type});
  const best=Array(n+1).fill(null);best[0]={c:0,prev:-1};
  const relax=(i,j,c)=>{const c2=best[i].c+c;if(!best[j]||c2<best[j].c)best[j]={c:c2,prev:i}};
  for(let i=0;i<n;i++){
    if(!best[i])continue;
    for(const {f,t} of forms){
      if(!s.startsWith(f,i))continue;
      const j=i+f.length;let c=1;
      if(f.length===1)c+=.8;
      if(t==='p'&&i!==0)c+=.6;
      if(t==='s'&&j!==n)c+=1.2;
      if(t==='r')c-=.3+.02*f.length; /* 同点なら長い語根（spect＞spec）を選ぶ */
      relax(i,j,c);
    }
    for(let j=i+1;j<=n;j++)relax(i,j,2.2+.4*(j-i));
  }
  const cuts=[];let j=n;while(j>0){cuts.unshift(j);j=best[j].prev}
  let out=[],a=0;for(const c of cuts){out.push(s.slice(a,c));a=c}
  return out.join('/');
}
function openEdit(id){
  if(id){
    const w=WMAP[id];if(!w)return;
    /* 追加の途中の下書きは、編集のあいだ別に取っておく */
    if(S.draft&&!S.draft.id)S.newDraft=S.draft;
    S.draft={...blankDraft(),id,w:w.w,pos:w.pos,m:w.m,split:w.segs.map(s=>s.t).join('/'),touched:true,g:w.g||'',ex:w.ex||'',exj:w.exj||'',
      sel:Object.fromEntries(w.segs.map((s,i)=>[i+':'+s.t.toLowerCase(),{pid:s.id,nm:'',nt:P[s.id]?P[s.id].type:'r'}]))};
  }else if(!S.draft||S.draft.id){S.draft=S.newDraft||blankDraft();S.newDraft=null}
  save();
  const d=S.draft;
  openSheet(`${sheetHead('<button class="x" data-act="close">閉じる</button>',d.id?'単語を直す':'単語を追加','<button class="x" data-act="saveWord">保存</button>')}

  <div class="row2"><label class="field" style="flex:0 0 110px"><span>品詞</span><select id="f-pos">${POS.map(p=>`<option ${p===d.pos?'selected':''}>${p}</option>`).join('')}</select></label>
  <label class="field"><span>意味</span><input id="f-m" value="${esc(d.m)}"></label></div>
  <label class="field"><span>区切り（/ で分ける）</span><input id="f-split" value="${esc(d.split)}" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></label>
  <p class="gfoot">英単語を入れると、アプリにあるパーツから区切りの候補を出します。違っていたら直してください。</p>
  <div id="segRows"></div>
  <label class="field"><span>成り立ち（なくてもよい）</span><input id="f-g" value="${esc(d.g)}" placeholder="例：中を見る → 詳しく調べる"></label>
  <label class="field"><span>例文（なくてもよい）</span><textarea id="f-ex" rows="2" autocorrect="off" spellcheck="false">${esc(d.ex)}</textarea></label>
  <label class="field"><span>例文の訳（なくてもよい）</span><textarea id="f-exj" rows="2">${esc(d.exj)}</textarea></label>
  <p class="err" id="f-err" hidden></p>
  <button class="btn primary mt" data-act="saveWord">保存</button>
  ${d.id?'':'<button class="btn plain danger" data-act="clearDraft">入力を消す</button>'}`);
  renderSegRows();
  $('#sheet').oninput=onEditInput;
}
function onEditInput(e){
  const t=e.target,d=S.draft;if(!d)return;
  const fe=$('#f-err');if(fe)fe.hidden=true;
  if(t.id==='f-w'){d.w=t.value.trim();if(!d.touched){d.split=suggest(d.w);$('#f-split').value=d.split;renderSegRows()}}
  else if(t.id==='f-split'){d.split=t.value;d.touched=t.value.trim()!=='';renderSegRows()}
  else if(t.id==='f-m')d.m=t.value;
  else if(t.id==='f-pos')d.pos=t.value;
  else if(t.id==='f-g')d.g=t.value;
  else if(t.id==='f-ex')d.ex=t.value;
  else if(t.id==='f-exj')d.exj=t.value;
  else if(t.dataset.seg!=null){
    const s=d.sel[t.dataset.seg]||(d.sel[t.dataset.seg]={pid:'new',nm:'',nt:'r'});
    s[t.dataset.f]=t.value;
    if(t.dataset.f!=='nm')renderSegRows();
  }
  save();
}
function renderSegRows(){
  const d=S.draft,segs=segsOf(d.split),n=segs.length;
  $('#segRows').innerHTML=segs.map((t,i)=>{
    const key=i+':'+t.toLowerCase(),cands=candidates(t);
    const want=n===1?'r':i===0?'p':i===n-1?'s':'r';
    let s=d.sel[key];
    if(!s||!s.pid||(s.pid!=='new'&&!P[s.pid])){const pick=cands.find(p=>p.type===want)||cands[0];s=d.sel[key]={pid:pick?pick.id:'new',nm:s?s.nm||'':'',nt:s&&s.nt?s.nt:want}}
    const ty=s.pid==='new'?s.nt:P[s.pid].type;
    return `<div class="segrow"><span class="chip ${ty}">${esc(t)}</span><div class="grow">
    <select data-seg="${esc(key)}" data-f="pid" aria-label="${esc(t)} の意味">${cands.map(c=>`<option value="${esc(c.id)}" ${c.id===s.pid?'selected':''}>${TYPE_NAME[c.type]}：${esc(c.m)}</option>`).join('')}<option value="new" ${s.pid==='new'?'selected':''}>新しいパーツとして入れる</option></select>
    ${s.pid==='new'?`<div class="row2"><select data-seg="${esc(key)}" data-f="nt" style="flex:0 0 110px">${['p','r','s'].map(x=>`<option value="${x}" ${x===s.nt?'selected':''}>${TYPE_NAME[x]}</option>`).join('')}</select><input data-seg="${esc(key)}" data-f="nm" value="${esc(s.nm||'')}" placeholder="パーツの意味"></div>`:''}
    </div></div>`;
  }).join('')||'<p class="sub small">区切りはまだありません。</p>';
}
function saveWord(){
  const d=S.draft;if(!d)return;
  const err=m=>{const e=$('#f-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'center'})};
  const w=(d.w||'').trim();
  if(!/^[A-Za-z][A-Za-z'-]*$/.test(w))return err('英単語を半角の英字で入れてください（空白なし）');
  if(!d.m.trim())return err('意味を入れてください');
  if(W.some(x=>x.w.toLowerCase()===w.toLowerCase()&&x.id!==d.id))return err(`「${w}」はもう入っています`);
  const segs=segsOf(d.split);
  if(segs.join('').toLowerCase()!==w.toLowerCase())return err('区切りをつなげたときに、英単語と同じ綴りになるようにしてください');
  const out=[],newParts={};let pos=0;
  for(let i=0;i<segs.length;i++){
    const t=segs[i],s=d.sel[i+':'+t.toLowerCase()]||{};let pid=s.pid;
    if(!pid||pid==='new'){
      const nm=(s.nm||'').trim();if(!nm)return err(`「${t}」の意味を入れてください`);
      const nt=['p','r','s'].includes(s.nt)?s.nt:'r',f=t.toLowerCase();
      const same=([k,p])=>p.type===nt&&p.m===nm&&p.forms.includes(f);
      const found=Object.entries(S.parts).find(same)||Object.entries(newParts).find(same);
      if(found)pid=found[0];else{pid='u_'+Date.now().toString(36)+i;newParts[pid]={type:nt,forms:[f],m:nm,o:''}}
    }else if(!P[pid])return err(`「${t}」のパーツを選び直してください`);
    out.push({id:pid,t:w.slice(pos,pos+t.length)});pos+=t.length;
  }
  Object.assign(S.parts,newParts);
  const rec={id:d.id||'c_'+Date.now().toString(36),w,pos:d.pos,m:d.m.trim(),segs:out,g:d.g.trim(),ex:d.ex.trim(),exj:d.exj.trim()};
  const idx=S.words.findIndex(x=>x.id===rec.id);
  if(idx>=0)S.words[idx]=rec;else S.words.push(rec);
  const edited=!!d.id;
  if(edited){S.draft=S.newDraft||null;S.newDraft=null}else S.draft=null;
  rebuild();save();closeSheet();render();toast(edited?'直しました':`「${w}」を追加しました`);
}
function delWord(id){
  /* 元に戻せる削除なので確認は出さず、すぐ消して「元に戻す」を出す */
  const w=S.words.find(x=>x.id===id);if(!w)return;
  const pr=S.prog[id];
  S.words=S.words.filter(x=>x.id!==id);delete S.prog[id];
  if(S.quiz&&S.quiz.mode==='w'&&S.quiz.qs.some(it=>it.k===id||it.ch.includes(id)))S.quiz=null;
  rebuild();save();closeSheet();render();
  toast(`「${w.w}」を削除しました`,()=>{if(!S.words.some(x=>x.id===id))S.words.push(w);if(pr&&!S.prog[id])S.prog[id]=pr;rebuild();save();render()});
}

/* ---------- 設定・バックアップ ---------- */
function fmtDate(t){const d=new Date(t);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}

  <p class="gfoot">覚えた単語は、1日後・3日後・7日後・14日後・30日後・60日後と、間をあけて復習に出てきます。「まだ」にした単語はその日のうちにもう一度出ます。</p>
  <p class="ghead">毎晩9時のお知らせ</p>

  </div>
  <p class="gfoot">通知は iPhone の「ショートカット」アプリから毎晩9時に出します。アイコンの数字は、このアプリを開いたときと閉じたときに新しくなります。</p>

  <div class="group" style="margin-top:28px"><button class="cell red" data-act="reset">学習の記録を消す</button></div>

}

/* ---------- 毎晩のお知らせ・アイコンの数字 ---------- */
function dueBy(t){return W.filter(w=>{const p=S.prog[w.id];return p&&p.d<=t}).length}
function updateBadge(){
  if(!S.set.badge||!('setAppBadge' in navigator))return;
  const n=dueBy(Date.now());
  try{const r=n?navigator.setAppBadge(n):navigator.clearAppBadge();if(r&&r.catch)r.catch(()=>{})}catch(e){}
}
async function toggleBadge(on,el){
  if(!on){S.set.badge=false;save();try{const r=navigator.clearAppBadge&&navigator.clearAppBadge();if(r&&r.catch)r.catch(()=>{})}catch(e){}return}
  if(!('setAppBadge' in navigator)||!('Notification' in window)){el.checked=false;toast('ここではアイコンの数字を使えません。ホーム画面のアイコンから開いてください');return}
  let p=Notification.permission;
  if(p==='default'){try{p=await Notification.requestPermission()}catch(e){}}
  if(p!=='granted'){el.checked=false;toast('通知が許可されていないため、数字を出せません。iPhone の「設定」→「通知」から許可できます');return}
  S.set.badge=true;save();updateBadge();toast('アイコンに復習の数を出します');
}
const NOTIFY_TEXT='単語帳の復習の時間です';
function openNotifyHelp(){
  const steps=[
    'iPhone の「ショートカット」アプリを開き、下の「オートメーション」をタップします。',
    '右上の「＋」（はじめてのときは「新規オートメーション」）をタップし、「時刻」を選びます。',
    '時刻を「21:00」、繰り返しを「毎日」にします。「すぐに実行」を選んで「次へ」をタップします。',
    '「新規の空のオートメーション」をタップし、「アクションを追加」で「通知を表示」を探して入れます。',
    `通知の文を「${NOTIFY_TEXT}」に書き換えて「完了」をタップします。`
  ];
  openSheet(`${sheetHead('<button class="x" data-act="close">閉じる</button>','通知の設定','')}
  <p class="gfoot" style="margin:6px 4px 0">一度設定すると、毎晩9時に iPhone に通知が届きます。</p>
  <ol class="group steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  <div class="group mt"><button class="cell link" data-act="copyNotify">通知の文をコピー</button></div>
  <p class="gfoot">通知をタップすると「ショートカット」アプリが開きます。単語帳は、ホーム画面のアイコンから開いてください。Safari で開くと、学習の記録が別になります。</p>
  <p class="gfoot">画面の名前は、iOS の版によって少し違うことがあります。</p>`);
}
async function doBackup(){
  const data=JSON.stringify({app:'parts-wordbook',v:1,at:Date.now(),state:{...S,draft:null,newDraft:null}});
  const d=new Date(),name=`parts-wordbook-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const file=new File([data],name,{type:'application/json'});
  const done=()=>{S.lastBackup=Date.now();save();render();toast('バックアップを保存しました')};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'単語帳のバックアップ'});done();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);done();
}
function restoreFrom(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(r.result)}catch(x){}
    const s=o&&o.app==='parts-wordbook'?sanitize(o.state):null;
    if(!s){toast('このファイルは単語帳のバックアップではないようです');return}
    actionSheet('今のデータを、バックアップの内容に置き換えます。','置き換える',()=>{
      s.lastBackup=Math.max(s.lastBackup||0,o.at||0);s.tab='set';
      S=s;rebuild();flipped=false;save();render();toast('バックアップから戻しました');
    });
  };
  r.readAsText(f);
}
function resetProgress(){
  actionSheet('「覚えた」「まだ」の記録をすべて消します。追加した単語は残ります。','学習の記録を消す',()=>{
    const snap=S.prog;S.prog={};S.sess=null;S.quiz=null;S.day={date:today(),newDone:0};save();render();
    toast('学習の記録を消しました',()=>{for(const [k,v] of Object.entries(snap))if(!S.prog[k])S.prog[k]=v;S.sess=null;save();render()});
  });
}
/* 確認のアクションシート：危険な選択は赤で上、キャンセルは下に離す */
let actOk=null;
function actionSheet(title,okLabel,onOk){
  actOk=onOk;
  $('#acts').innerHTML=`<div class="group"><div class="atitle">${esc(title)}</div><button class="cell red" data-act="actOk">${esc(okLabel)}</button></div><div class="group cancel"><button class="cell" data-act="actCancel" style="color:var(--accent);font-weight:600">キャンセル</button></div>`;
  $('#actWrap').hidden=false;
}
function closeActs(){$('#actWrap').hidden=true;$('#acts').innerHTML='';actOk=null}

/* ---------- お知らせ ---------- */
let toastT=null,toastUndo=null;
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">元に戻す</button>':''}`;
  t.hidden=false;toastUndo=undo||null;clearTimeout(toastT);
  toastT=setTimeout(()=>{t.hidden=true;toastUndo=null},undo?6000:2200);
}

/* ---------- 操作 ---------- */
const ACT={
  tab:el=>{if(S.tab===el.dataset.t){toTop();return}S.tab=el.dataset.t;save();render();toTop()},
  flip:()=>{if(!flipped){flipped=true;renderCard()}},
  say:el=>say(el.dataset.w),
  judge:el=>judge(el.dataset.v==='1'),
  more:()=>{buildSession(true);render();toTop()},
  retry:()=>{buildSession(false);render();toTop()},
  rtab:el=>{S.rootTab=el.dataset.t;save();renderRoots();toTop()},
  part:el=>goPart(el.dataset.id),
  open:el=>openWord(el.dataset.id),
  close:()=>closeSheet(),
  mark:el=>{setStatus(el.dataset.id,el.dataset.v==='1');save();render();openWord(el.dataset.id);toast(el.dataset.v==='1'?'「覚えた」にしました':'「まだ」にしました')},
  add:()=>openEdit(null),
  edit:el=>openEdit(el.dataset.id),
  del:el=>delWord(el.dataset.id),
  saveWord:()=>saveWord(),
  clearDraft:()=>{S.draft=blankDraft();save();openEdit(null)},
  filter:el=>{listF=el.dataset.f;renderRows()},
  qstart:el=>{makeQuiz(el.dataset.m);render();toTop()},
  qpick:el=>{
    const q=S.quiz,it=q&&q.qs[q.i];if(!it||it.pick!==null)return;
    it.pick=+el.dataset.i;
    if(it.pick!==it.a&&q.mode==='w')setStatus(it.k,false);
    save();renderQuiz();
  },
  qnext:()=>{if(!S.quiz)return;S.quiz.i++;save();renderQuiz();toTop()},
  qend:()=>{S.quiz=null;save();renderQuiz();toTop()},
  newPer:el=>{S.set.newPerDay=+el.dataset.v;save();renderSet()},
  backup:()=>doBackup(),
  restore:()=>$('#restoreFile')?$('#restoreFile').click():(S.tab='set',render(),$('#restoreFile').click()),
  reset:()=>resetProgress(),
  notifyHelp:()=>openNotifyHelp(),
  copyNotify:()=>{try{navigator.clipboard.writeText(NOTIFY_TEXT).then(()=>toast('コピーしました'),()=>toast(`「${NOTIFY_TEXT}」と入れてください`))}catch(e){toast(`「${NOTIFY_TEXT}」と入れてください`)}},
  actOk:()=>{const f=actOk;closeActs();if(f)f()},
  actCancel:()=>closeActs(),
  undo:()=>{const f=toastUndo;toastUndo=null;$('#toast').hidden=true;if(f)f()},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});

load();rebuild();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
/* 閉じたまま日をまたいでも、開き直したときにその日の分を作り直す。閉じるときはアイコンの数字を新しくする */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if($('#sheetWrap').hidden&&$('#actWrap').hidden)render();else updateBadge()}
  else updateBadge();
});
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function () {
  function canScroll(el) {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      var s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return true;
      if (/(auto|scroll)/.test(s.overflowX) && el.scrollWidth > el.clientWidth + 1) return true;
    }
    return false;
  }
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) return;
    var t = e.target;
    if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
    if (!canScroll(t)) e.preventDefault();
  }, { passive: false });
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
